name: vibecodingkurs avtopost

on:
  schedule:
    - cron: "50 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = faqat sizga (sinov) | now = hozir, 10 daqiqadan keyin kanalga | scheduled"
        default: "dry"
        type: choice
        options: [dry, now, scheduled]

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

defaults:
  run:
    working-directory: ai-agent

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalar
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Konveyerni ishga tushirish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python autopost.py --mode "${{ github.event.inputs.mode || 'scheduled' }}"

      - name: Tarixni saqlash
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history: $(date -u +%F)" && git push)
